[package]
name = "rterm"
version = "2.0.0"
publish = false
edition = "2024"
default-run = "rterm"

[features]
benchmark = ["windows-sys/Win32_System_ProcessStatus"]

[build-dependencies]
embed-resource = "3.0"

[dependencies]
ab_glyph = "0.2"
alacritty_terminal = { path = "vendor/alacritty_terminal", default-features = false }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
blake3 = "1.5"
bytes = "1.11"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.4.0"
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
percent-encoding = "2.3"
portable-pty = "0.9"
rand = "0.10"
regex = "1"
rfd = "0.15.4"
russh = { version = "0.65.4", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.6", default-features = false }
ssh-key = { version = "=0.7.0-rc.12", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "fs", "process"] }
tokio-serial = { version = "5.4", default-features = false }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Match the desktop compositor instead of winit's basic grey fallback frame.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Globalization"] }

# Keep source locations in application backtraces without spending time and
# disk space generating full DWARF/PDB information for every dependency.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = 3
strip = "symbols"
lto = "thin"
codegen-units = 1

[patch.crates-io]
eframe = { path = "vendor/eframe" }
pageant = { path = "vendor/pageant" }
