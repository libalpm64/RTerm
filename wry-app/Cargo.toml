[package]
name = "rterm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rterm"
path = "src/main.rs"

[dependencies]
wry = { version = "0.51", features = ["devtools"] }
tao = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1.11"
russh = "0.63.1"
russh-sftp = "2.4.0"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "fs", "process"] }
lazy_static = "1.4"
base64 = "0.22"
chacha20poly1305 = "0.10"
blake3 = "1.5"
argon2 = "0.5"
rand = "0.10"
serialport = "4.6"
tokio-serial = "5.4"


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
