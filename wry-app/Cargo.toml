[package]
name = "rterm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rterm"
path = "src/main.rs"

[dependencies]
wry = { version = "0.51", features = ["devtools"] }
tao = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { path = "../external/russh-main/russh", version = "0.60.1" }
russh-sftp = { path = "../external/russh-sftp" }
ssh-key = { package = "internal-russh-forked-ssh-key", version = "=0.6.18" }
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4"
base64 = "0.22"
chacha20poly1305 = "0.10"


[patch.crates-io]
ed25519-dalek = { path = "../external/curve25519-dalek/ed25519-dalek" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
debug = true
