# Review new license families before accepting them. Prefer a permissive option
# for dual-licensed crates; retain all requirements of AND expressions.
accepted = [
    "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSD-1-Clause",
    "ISC", "Zlib", "BSL-1.0", "Unicode-3.0", "Unicode-DFS-2016",
    "CC0-1.0", "MIT-0", "0BSD", "Unlicense", "OFL-1.1", "Ubuntu-font-1.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false

[private]
# RTerm is distributed as a desktop application, not as a registry crate.
# Its own license is separate from third-party notices.
ignore = true

[serialport]
accepted = ["MPL-2.0"]

