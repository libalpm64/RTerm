name: Native builds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev libudev-dev libdbus-1-dev pkg-config desktop-file-utils shellcheck
      - uses: ./.github/actions/check-rust
      - run: cargo build --release --locked --bins
      - if: runner.os == 'Linux'
        run: |
          shellcheck -x run.sh packaging/linux/*.sh packaging/macos/*.sh
          python3 packaging/linux/test_install.py
