name: Check RTerm Rust code
description: Shared formatting, lint and regression gates on the native runner
runs:
  using: composite
  steps:
    - run: rustup update stable --no-self-update
      shell: bash
    - run: rustup component add rustfmt clippy
      shell: bash
    - run: cargo fmt --package rterm -- --check
      shell: bash
    # Use one Cargo profile throughout the job. The release test harness
    # covers all features, and the subsequent production build can reuse
    # the optimized dependencies instead of compiling the debug graph too.
    - run: cargo clippy --release --locked --all-targets --all-features -- -D warnings
      shell: bash
    # The runner wraps only the test executable, not compilation/linking.
    # A timeout is a failing test gate on every native runner.
    - name: Run optimized tests with a watchdog
      run: |
        cargo --config 'target."cfg(all())".runner = ["python", ".github/scripts/run-test-with-timeout.py"]' test --release --locked --all-features --bins
      shell: bash
